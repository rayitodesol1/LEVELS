      <p class="about__text" data-en="An architect who graduated from Universidad Piloto de Colombia, with experience in design, permitting, site supervision, cost estimating and budgeting, and construction. I approach the environment through phenomenology to turn the experience of space into a tool for wellbeing and human development. My technical training on site, in budgets and in leading teams allows me to bring this sensitive vision into built reality, with rigor, feasibility and faithfulness to the design. My proposal is a warm, organic and conscious architecture that accompanies the life of those who inhabit it. Today I work from Puerto Rico, remotely, with projects in Colombia and abroad." data-es="Arquitecta egresada de la Universidad Piloto de Colombia, con experiencia en diseño, licenciamiento, interventoría, costos, presupuestos y ejecución de obra. Comprendo el entorno desde la fenomenología para transformar la experiencia del espacio en una herramienta para el bienestar y el desarrollo humano. Mi formación técnica en obra, presupuestos y dirección de personal me permite llevar esta visión sensible a la realidad construida, con rigor, viabilidad y cumplimiento de lo diseñado. Mi propuesta es una arquitectura cálida, orgánica y consciente, que acompaña la vida de quien la habita. Hoy trabajo desde Puerto Rico, de forma remota, con proyectos en Colombia y otros países."></p>

<!-- 5. FAQ -->
<section class="faq" id="faq">
  <div class="wrap">
    <p class="eyebrow" data-en="FAQ" data-es="Preguntas frecuentes"></p>
    <h2 class="display" data-en="Questions" data-es="Preguntas"></h2>
    <p class="faq__slogan" data-en="Living in <em>balance</em>" data-es="Habitar en <em>equilibrio</em>"></p>
    <div class="faq__list">
      <details>
        <summary data-en="<span class='faq__n'>01</span>What does LEVELS mean?" data-es="<span class='faq__n'>01</span>¿Qué significa LEVELS?"></summary>
        <div class="faq__a"
          data-en="<p>LEVELS starts from the concept of hierarchy, and I apply it by distinguishing each space according to the importance it is meant to have. It shows through heights and level changes: double heights, platforms and transitions. With those differences in level I define which space leads, its paths and experiences, how people relate to one another and what each of them experiences as they move through it. Each level has an intention, and together they form a balanced whole.</p>"
          data-es="<p>LEVELS parte del concepto de jerarquía, y lo aplico diferenciando cada espacio según la importancia que se quiere generar. Se refleja a través de las alturas y los desniveles: dobles alturas, plataformas y transiciones. Con esas diferencias de nivel defino qué espacio domina, sus recorridos y experiencias, cómo se relacionan los usuarios y qué experiencia vive cada uno al recorrerlo. Cada nivel tiene una intención, y juntos forman un conjunto equilibrado.</p>"></div>
      </details>
      <details>
        <summary data-en="<span class='faq__n'>02</span>Why is phenomenology a pillar of the way you design?" data-es="<span class='faq__n'>02</span>¿Por qué la fenomenología es un pilar en tu forma de proyectar?"></summary>
        <div class="faq__a"
          data-en="<p>It is a pillar of the way I design because the built environment directly shapes human development: how we rest, relate, work and feel depends to a great extent on the space we inhabit. That is why, in my practice, experience is the starting point, and I balance it with usefulness, function and beauty. Every project starts from one question: what does the person who will inhabit this place want to experience? From there I define how it blends with its surroundings, the hierarchy of the project and its bioclimatic factors, how light comes in, what is heard, what is touched and how the space is walked through.</p><p class='faq__refs'>To go further: <a href='https://en.wikipedia.org/wiki/Architectural_phenomenology' target='_blank' rel='noopener'>Architectural phenomenology</a> · <a href='https://en.wikipedia.org/wiki/Juhani_Pallasmaa' target='_blank' rel='noopener'>Juhani Pallasmaa, <i>The Eyes of the Skin</i></a> · <a href='https://en.wikipedia.org/wiki/Peter_Zumthor' target='_blank' rel='noopener'>Peter Zumthor, <i>Atmospheres</i></a> · <a href='https://en.wikipedia.org/wiki/Steven_Holl' target='_blank' rel='noopener'>Steven Holl, <i>Questions of Perception</i></a></p>"
          data-es="<p>Es un pilar en mi forma de proyectar porque el entorno construido influye directamente en el desarrollo humano: cómo descansamos, nos relacionamos, trabajamos y nos sentimos depende en buena parte del espacio que habitamos. Por eso, en mi práctica, la experiencia es el punto de partida, y la equilibro con la utilidad, la funcionalidad y la belleza. En cada proyecto parto de una pregunta: ¿qué quiere experimentar quien habite este lugar? Desde ahí defino cómo se integra con el entorno, la jerarquía del proyecto y los factores bioclimáticos, cómo entra la luz, qué se oye, qué se toca y cómo se recorre el espacio.</p><p class='faq__refs'>Para profundizar: <a href='https://en.wikipedia.org/wiki/Architectural_phenomenology' target='_blank' rel='noopener'>Fenomenología de la arquitectura</a> · <a href='https://en.wikipedia.org/wiki/Juhani_Pallasmaa' target='_blank' rel='noopener'>Juhani Pallasmaa, <i>Los ojos de la piel</i></a> · <a href='https://es.wikipedia.org/wiki/Peter_Zumthor' target='_blank' rel='noopener'>Peter Zumthor, <i>Atmósferas</i></a> · <a href='https://en.wikipedia.org/wiki/Steven_Holl' target='_blank' rel='noopener'>Steven Holl, <i>Cuestiones de percepción</i></a></p>"></div>
      </details>
      <details>
        <summary data-en="<span class='faq__n'>03</span>How do you bring bioclimatic design into your projects?" data-es="<span class='faq__n'>03</span>¿Cómo incorporas la bioclimática en tus proyectos?"></summary>
        <div class="faq__a"
          data-en="<p>Bioclimatic design is part of the project from the very first line. I start with a bioclimatic study of the site: the path of the sun, winds, temperature, humidity, rainfall and surroundings. With that data I define:</p><ul><li><b>Orientation:</b> each use receives the sun and light it needs.</li><li><b>Openings and cross ventilation:</b> the air renews itself naturally.</li><li><b>Eaves, lattices and vegetation:</b> they protect from the sun without losing light.</li><li><b>Natural light:</b> it reduces dependence on artificial light.</li><li><b>Heights:</b> warm air rises and escapes, which connects with my work on levels.</li><li><b>Materials:</b> I choose them for their thermal behavior in that climate and favor local materials.</li></ul><p>Every decision serves a climatic purpose and also improves how the space is used and felt.</p><p class='faq__refs'>To go further: <a href='https://en.wikipedia.org/wiki/Passive_solar_building_design' target='_blank' rel='noopener'>Passive solar and bioclimatic design</a> · <a href='https://en.wikipedia.org/wiki/Victor_Olgyay' target='_blank' rel='noopener'>Victor Olgyay, <i>Design with Climate</i></a> · <a href='https://www.terrapinbrightgreen.com/reports/14-patterns/' target='_blank' rel='noopener'>14 Patterns of Biophilic Design</a></p>"
          data-es="<p>La bioclimática es parte del diseño desde el primer trazo. Empiezo con un estudio bioclimático del sitio: recorrido del sol, vientos, temperatura, humedad, lluvias y entorno. Con esos datos defino:</p><ul><li><b>Orientación:</b> cada uso recibe el sol y la luz que necesita.</li><li><b>Aberturas y ventilación cruzada:</b> el aire se renueva de forma natural.</li><li><b>Aleros, celosías y vegetación:</b> protegen del sol sin perder luz.</li><li><b>Luz natural:</b> reduce la dependencia de la luz artificial.</li><li><b>Alturas:</b> el aire caliente sube y sale, lo que conecta con mi trabajo de niveles.</li><li><b>Materiales:</b> los elijo por su comportamiento térmico en ese clima y priorizo materiales del lugar.</li></ul><p>Cada decisión cumple una función climática y también mejora cómo se usa y se siente el espacio.</p><p class='faq__refs'>Para profundizar: <a href='https://es.wikipedia.org/wiki/Arquitectura_bioclim%C3%A1tica' target='_blank' rel='noopener'>Arquitectura bioclimática</a> · <a href='https://en.wikipedia.org/wiki/Victor_Olgyay' target='_blank' rel='noopener'>Victor Olgyay, <i>Arquitectura y clima</i></a> · <a href='https://www.terrapinbrightgreen.com/reports/14-patterns/' target='_blank' rel='noopener'>14 patrones del diseño biofílico</a></p>"></div>
      </details>
      <details>
        <summary data-en="<span class='faq__n'>04</span>What does it mean to organize a space in an energetically balanced way?" data-es="<span class='faq__n'>04</span>¿Qué significa organizar un espacio de forma energéticamente equilibrada?"></summary>
        <div class="faq__a"
          data-en="<p>It means designing projects that are friendly to their surroundings and give something back to them. I combine a balanced use of bioclimatic criteria with a precise spatial organization, so that each zone has its function, its proportion and its relationship with the whole. The result is a space that flows, is comfortable and tells a positive story: that of an architecture that adds to the place instead of imposing itself.</p>"
          data-es="<p>Es diseñar proyectos amigables con su entorno y que aportan a él. Combino un uso equilibrado de los criterios bioclimáticos con una organización espacial precisa, de modo que cada zona tenga su función, su proporción y su relación con el conjunto. El resultado es un espacio que fluye, es cómodo y cuenta una historia favorable: la de una arquitectura que suma al lugar en vez de imponerse.</p>"></div>
      </details>
      <details>
        <summary data-en="<span class='faq__n'>05</span>What is the LEVELS slogan and what does it mean?" data-es="<span class='faq__n'>05</span>¿Cuál es el slogan de LEVELS y qué significa?"></summary>
        <div class="faq__a"
          data-en="<p><em>“Living in balance”</em> (Habitar en equilibrio): each element responds to one of my pillars.</p><ul><li><b>Living</b> (inhabiting) is the central verb of phenomenology. Space is not looked at, it is lived with the body, the light and the climate, and that unites experience, usefulness, function and beauty.</li><li><b>Balance</b> covers two things at once: the bioclimatic balance (light, ventilation, temperature, surroundings) and the energetic balance of the space.</li><li><b>LEVELS</b> is implied. The slogan does not repeat the name, but every level of a project (the body, the space, the surroundings) is resolved in harmony.</li></ul>"
          data-es="<p><em>“Habitar en equilibrio”</em>: cada elemento responde a uno de mis pilares.</p><ul><li><b>Habitar</b> es el verbo central de la fenomenología. No se mira el espacio, se lo vive con el cuerpo, la luz y el clima, y eso une experiencia, utilidad, funcionalidad y belleza.</li><li><b>Equilibrio</b> cubre dos cosas a la vez: el balance bioclimático (luz, ventilación, temperatura, entorno) y el balance energético del espacio.</li><li><b>LEVELS</b> queda implícito. El slogan no repite el nombre, pero cada nivel de un proyecto (el cuerpo, el espacio, el entorno) se resuelve en armonía.</li></ul>"></div>
      </details>
      <details>
        <summary data-en="<span class='faq__n'>06</span>How do you work?" data-es="<span class='faq__n'>06</span>¿Cómo trabajas?"></summary>
        <div class="faq__a"
          data-en="<p>Every project is a process we walk together, step by step:</p><ul><li><b>A first conversation.</b> We get to know each other. I listen to how you live, what you dream of and what you need, along with your budget and timeline.</li><li><b>Studying the place.</b> I visit and analyze the site: the bioclimatic study (sun, winds, climate), the surroundings and the regulations that apply.</li><li><b>The concept proposal.</b> I present the idea of the project, the organization of its levels and the first images, and we review it together.</li><li><b>Design development.</b> Plans, renders, materials and details, refined with you until every space feels right.</li><li><b>Budget and permits.</b> Costs, the construction budget and the permitting process, so everything is clear before building.</li><li><b>Construction and support.</b> I accompany the work on site so that what is built is faithful to what was designed.</li></ul>"
          data-es="<p>Cada proyecto es un proceso que recorremos juntos, paso a paso:</p><ul><li><b>Una primera conversación.</b> Nos conocemos. Escucho cómo vives, qué sueñas y qué necesitas, junto con tu presupuesto y tus tiempos.</li><li><b>El estudio del lugar.</b> Visito y analizo el sitio: el estudio bioclimático (sol, vientos, clima), el entorno y la normativa que aplica.</li><li><b>La propuesta conceptual.</b> Te presento la idea del proyecto, la organización de sus niveles y las primeras imágenes, y la revisamos juntos.</li><li><b>El desarrollo del diseño.</b> Planos, renders, materiales y detalles, ajustados contigo hasta que cada espacio se sienta bien.</li><li><b>Presupuesto y licencias.</b> Costos, presupuesto de obra y trámites de licenciamiento, para que todo esté claro antes de construir.</li><li><b>Obra y acompañamiento.</b> Acompaño la construcción para que lo construido sea fiel a lo diseñado.</li></ul>"></div>
      </details>
      <details>
        <summary data-en="<span class='faq__n'>07</span>Do you design residential, commercial or both?" data-es="<span class='faq__n'>07</span>¿Diseñas proyectos residenciales, comerciales o ambos?"></summary>
        <div class="faq__a"
          data-en="<p>Both. Each project starts from the same question, whatever its use. Commercial: <b>CIELO</b>, an açaí bowl shop in Mosquera. Residential: <b>FINCA LOMIX</b> (a country retreat in Cumaca), <b>EL REFUGIO</b> (a family home extended in Pacho) and <b>CASA NIDO</b> (a home that opens to the garden in Anapoima). New builds, extensions and remodels.</p>"
          data-es="<p>Ambos. Cada proyecto parte de la misma pregunta, sea cual sea su uso. Comercial: <b>CIELO</b>, una tienda de açaí bowls en Mosquera. Residencial: <b>FINCA LOMIX</b> (finca de retiro en Cumaca), <b>EL REFUGIO</b> (casa familiar ampliada en Pacho) y <b>CASA NIDO</b> (casa que se abre al jardín en Anapoima). Obra nueva, ampliaciones y remodelaciones.</p>"></div>
      </details>
      <details>
        <summary data-en="<span class='faq__n'>08</span>Where are you based? Do you work remotely?" data-es="<span class='faq__n'>08</span>¿Dónde estás? ¿Trabajas de forma remota?"></summary>
        <div class="faq__a"
          data-en="<p>I am based in Puerto Rico and work remotely. Levels offers international services, and my projects are in Colombia: the design process, advisory and follow-up can be done remotely, with virtual meetings and digital deliverables (plans, renders and walkthroughs). <a data-wa href='https://wa.me/17877106964' target='_blank' rel='noopener'>Write to me on WhatsApp</a> and we will look at your project and where it is.</p>"
          data-es="<p>Estoy en Puerto Rico y trabajo de forma remota. Levels ofrece servicios internacionales, y mis proyectos están en Colombia: el proceso de diseño, la asesoría y el seguimiento pueden hacerse de forma remota, con reuniones virtuales y entregas digitales (planos, renders y recorridos). <a data-wa href='https://wa.me/17877106964' target='_blank' rel='noopener'>Escríbeme por WhatsApp</a> y revisamos tu proyecto y su ubicación.</p>"></div>
      </details>
      <details>
        <summary data-en="<span class='faq__n'>09</span>Do you handle the construction or only the design?" data-es="<span class='faq__n'>09</span>¿Te encargas de la obra o solo del diseño?"></summary>
        <div class="faq__a"
          data-en="<p>Both are possible. Besides design, my experience covers permitting, site supervision, cost estimating, budgeting and construction. You can hire only the design, or the full process so that what is built is faithful to what was designed.</p>"
          data-es="<p>Ambas cosas. Además del diseño, mi experiencia incluye licenciamiento, interventoría, costos, presupuestos y ejecución de obra. Puedes contratar solo el diseño o el proceso completo, para que lo construido sea fiel a lo diseñado.</p>"></div>
      </details>
      <details>
        <summary data-en="<span class='faq__n'>10</span>How long does a project take?" data-es="<span class='faq__n'>10</span>¿Cuánto dura un proyecto?"></summary>
        <div class="faq__a"
          data-en="<p>It depends on the scope: a remodel is not the same as a new build, and permits have their own timing. In our first conversation we define the scope and I give you a clear schedule for each stage.</p>"
          data-es="<p>Depende del alcance: no es lo mismo una remodelación que una obra nueva, y las licencias tienen sus propios tiempos. En nuestra primera conversación definimos el alcance y te entrego un cronograma claro por etapas.</p>"></div>
      </details>
      <details>
        <summary data-en="<span class='faq__n'>11</span>What does bioclimatic design save me?" data-es="<span class='faq__n'>11</span>¿Qué me ahorra el diseño bioclimático?"></summary>
        <div class="faq__a"
          data-en="<p>Comfort with less energy and less water. Orienting the house to the sun and wind, using cross ventilation and natural light reduces the need for air conditioning and artificial lighting. Collecting rainwater for bathrooms and gardens reduces drinking-water use. You can see it in my projects: the lattice of CIELO, the rain gutters of EL REFUGIO and the rain channel and solar panels of CASA NIDO.</p><p class='faq__refs'>To go further: <a href='https://en.wikipedia.org/wiki/Rainwater_harvesting' target='_blank' rel='noopener'>Rainwater harvesting</a> · <a href='https://en.wikipedia.org/wiki/Passive_solar_building_design' target='_blank' rel='noopener'>Passive solar design</a></p>"
          data-es="<p>Confort con menos energía y menos agua. Orientar la casa según el sol y el viento, y usar ventilación cruzada y luz natural, reduce la necesidad de aire acondicionado y de luz artificial. Recolectar el agua lluvia para baños y jardines reduce el consumo de agua potable. Lo puedes ver en mis proyectos: la celosía de CIELO, las canaletas de EL REFUGIO y el canal de agua lluvia y los paneles solares de CASA NIDO.</p><p class='faq__refs'>Para profundizar: <a href='https://en.wikipedia.org/wiki/Rainwater_harvesting' target='_blank' rel='noopener'>Recolección de agua lluvia</a> · <a href='https://es.wikipedia.org/wiki/Arquitectura_bioclim%C3%A1tica' target='_blank' rel='noopener'>Arquitectura bioclimática</a></p>"></div>
      </details>
      <details>
        <summary data-en="<span class='faq__n'>12</span>Why plants inside the project? What is biophilic design?" data-es="<span class='faq__n'>12</span>¿Por qué plantas dentro del proyecto? ¿Qué es el diseño biofílico?"></summary>
        <div class="faq__a"
          data-en="<p>Biophilic design brings nature into architecture: light, vegetation, natural materials and views. It is linked to lower stress and greater well-being, which is why I choose local plants, adapted to the climate and with less upkeep, as in CIELO and CASA NIDO.</p><p class='faq__refs'>To go further: <a href='https://en.wikipedia.org/wiki/Biophilic_design' target='_blank' rel='noopener'>Biophilic design</a> · <a href='https://www.terrapinbrightgreen.com/reports/14-patterns/' target='_blank' rel='noopener'>14 Patterns of Biophilic Design</a></p>"
          data-es="<p>El diseño biofílico lleva la naturaleza a la arquitectura: luz, vegetación, materiales naturales y visuales al paisaje. Se asocia con menos estrés y más bienestar, por eso elijo plantas del lugar, adaptadas al clima y de menor mantenimiento, como en CIELO y CASA NIDO.</p><p class='faq__refs'>Para profundizar: <a href='https://es.wikipedia.org/wiki/Dise%C3%B1o_biof%C3%ADlico' target='_blank' rel='noopener'>Diseño biofílico</a> · <a href='https://www.terrapinbrightgreen.com/reports/14-patterns/' target='_blank' rel='noopener'>14 patrones del diseño biofílico</a></p>"></div>
      </details>
    </div>
  </div>
</section>
